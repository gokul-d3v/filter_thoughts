openapi: 3.0.3
info:
  title: Veritas Chat API
  version: 1.0.0
  description: Anonymous Real-Time Chat Platform
servers:
  - url: http://localhost:8080/api/v1
    description: Local development server
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
  /sessions:
    post:
      summary: Create an anonymous session
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string
                  display_name:
                    type: string
  /rooms:
    get:
      summary: List active rooms
      responses:
        '200':
          description: List of rooms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Room'
    post:
      summary: Create a new room
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: Room created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Room'
components:
  schemas:
    Room:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        active_members:
          type: integer
        created_at:
          type: string
          format: date-time
